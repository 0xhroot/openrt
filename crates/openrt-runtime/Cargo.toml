[package]
name = "openrt-runtime"
description = "OpenRT core runtime: bootstrap, lifecycle, session/task orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
