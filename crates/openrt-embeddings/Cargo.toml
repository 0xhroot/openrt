[package]
name = "openrt-embeddings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Local neural embeddings over an Ollama-compatible HTTP endpoint. SEC-07:
# the default library build carries no HTTP/TLS stack; CLI/runtime/tests opt in.
ollama = ["dep:reqwest", "dep:tokio"]

[dependencies]
openrt-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
[lints]
workspace = true
