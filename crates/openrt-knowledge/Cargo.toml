[package]
name = "openrt-knowledge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Phase 4 knowledge-base layer: planned KB lifecycle, corpus membership, chunk+vector indexing, honest search with citations, and a no-fabrication RAG oracle."

[dependencies]
openrt-core = { workspace = true }
openrt-persistence = { workspace = true }
openrt-ingest = { workspace = true }
openrt-embeddings = { workspace = true }
openrt-models = { workspace = true }
openrt-retrieval = { workspace = true }
openrt-vectorindex = { workspace = true }
openrt-dataset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
