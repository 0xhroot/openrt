openrt-config = { workspace = true }
openrt-telemetry = { workspace = true }
openrt-persistence = { workspace = true }
openrt-models = { workspace = true }
openrt-tools = { workspace = true }
openrt-computer = { workspace = true }
openrt-sandbox = { workspace = true }
openrt-safety = { workspace = true }
openrt-permissions = { workspace = true }
openrt-resources = { workspace = true }
openrt-agents = { workspace = true }
openrt-blackboard = { workspace = true }
openrt-checkpoint = { workspace = true }
openrt-orch = { workspace = true }
openrt-compiler = { workspace = true }
openrt-audit = { workspace = true }
openrt-modes = { workspace = true }
openrt-registry = { workspace = true }
openrt-router = { workspace = true }
openrt-timeseries = { workspace = true }
openrt-memory = { workspace = true }
openrt-workspace = { workspace = true }
openrt-workspace-assets = { workspace = true }
openrt-selfimprove = { workspace = true }
openrt-bench = { workspace = true }
openrt-industrial = { workspace = true }
openrt-trading = { workspace = true }
openrt-train = { workspace = true }
openrt-model-cache = { workspace = true }
openrt-hierarchy = { workspace = true }
openrt-provider-llamacpp = { workspace = true }
openrt-provider-vllm = { workspace = true }
openrt-policy = { workspace = true }
openrt-secrets = { workspace = true }
