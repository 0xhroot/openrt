[package]
name = "openrt-tools"
description = "OpenRT tool registry, schema validation and safe built-in tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# `DirectExecutor` (ungated, for tests/demos only) is compiled only when this
# feature is enabled. Non-test builds never ship the ungated path (SEC-04).
demo = []

[dependencies]
openrt-core = { workspace = true }
openrt-resources = { workspace = true }
openrt-permissions = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
[lints]
workspace = true
