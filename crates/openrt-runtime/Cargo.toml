[features]
default = []
ollama = ["openrt-models/ollama", "openrt-embeddings/ollama"]
llamacpp = ["openrt-provider-llamacpp/llamacpp"]
vllm = ["openrt-provider-vllm/vllm"]

[dev-dependencies]
# `DirectExecutor` is test-only (SEC-04): enabled for this crate's test build.
openrt-tools = { workspace = true, features = ["demo"] }
[lints]
workspace = true
