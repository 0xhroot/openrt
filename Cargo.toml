serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
async-trait = "0.1"
ring = "0.17"
tokio = { version = "1.53", features = ["rt", "macros", "sync", "time", "fs", "io-util", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
libc = "0.2"
url = "2.5"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
# Phase 7B database tools: embedded SQLite (bundled, offline, no system lib).
rusqlite = { version = "0.31", features = ["bundled"] }
# Ed25519 signatures for signed offline security bundles (ADR-003). MSRV 1.81
# matches the workspace; default features off (no rand/rand_core needed — keys
# are loaded from bytes, never generated at runtime).
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc", "pkcs8", "zeroize"] }
# Genuine PDF text extraction: FlateDecode stream decompression (pure Rust,
# deterministic, offline). Introduced for Phase 4 multimodal intake.
flate2 = "1.0"
# Phase 5.1 TUI backend (M5.1: persistent workspace + session UX in TUI).
# Offline-available (registry cache verified); crossterm 0.29 matches the
# default ratatui-crossterm backend.
# `unstable-rendered-line-info`: Paragraph::line_count — the chat stream is
# bottom-anchored and needs the WRAPPED row count (logical lines != rows).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
# Same crate ratatui-core measures with, so a width this workspace
# computes is the width ratatui will actually paint. Measuring with one
# implementation and rendering with another is how truncation ends up
# overrunning its column.
unicode-segmentation = "1.13"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
# keep defaults; disable incremental compilation so target/debug/incremental
# does not accumulate multi-GiB caches between sessions.
incremental = false